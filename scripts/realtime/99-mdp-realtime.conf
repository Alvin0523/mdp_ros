# Lets members of the `realtime` group run threads at real-time (FIFO) priority,
# as ros2_control's controller_manager asks for its 50 Hz loop. Without it the
# log says "Could not enable FIFO RT scheduling" and the loop runs late
# whenever another process has the CPU (Pi 2026-10-02: ~4 overruns per 100 s).
# Values from the ros2_control docs, minus their `priority 99`: that is the
# default nice of every login process, capped at 19 - the whole bringup ran at
# the lowest CPU priority (Pi 2026-10-15). Install: pixi run realtime (install.sh).
@realtime soft rtprio 99
@realtime hard rtprio 99
@realtime soft memlock 102400
@realtime hard memlock 102400
