controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 10.0
    steering_joints_names: ['left_joint', 'right_joint']
    traction_joints_names: ['lb_joint', 'rb_joint']

    wheelbase: 0.147
    steering_track_width: 0.16
    traction_track_width: 0.16
    steering_wheels_radius: 0.0325
    traction_wheels_radius: 0.0325

    open_loop: false
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_link

    cmd_vel_timeout: 10.0
    publish_limited_velocity: true
    use_stamped_vel: false
