controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 10.0
    # ackermann_steering_controller/steering_controllers_library expects RIGHT
    # joint first, then LEFT (confirmed in steering_controllers_library_parameters.hpp's
    # own parameter descriptor) - matches real_controller.yaml's fix. Verified live in
    # sim: with the old left-first order, the inner wheel spun FASTER than the outer
    # wheel during a turn (physically backwards).
    steering_joints_names: ['right_joint', 'left_joint']
    traction_joints_names: ['rb_joint', 'lb_joint']

    wheelbase: 0.1433
    steering_track_width: 0.104
    traction_track_width: 0.16
    steering_wheels_radius: 0.0325
    traction_wheels_radius: 0.0325

    open_loop: false
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_footprint

    cmd_vel_timeout: 10.0
    publish_limited_velocity: true
    use_stamped_vel: true

    # SAME as real_controller.yaml, so the sim EKF weighs wheels vs IMU the
    # way the real car does: vx from the wheels, yaw rate from the gyro.
    # This used to trust wheel yaw rate ~100000x more (0.00001, on the idea
    # that sim wheels are ideal kinematics with no slip). A ground-truth
    # check (2026-09-25, /sim/ground_truth vs odometry over a full task-1
    # run) showed the opposite: the sim IMU stayed within 2 deg of truth,
    # wheel-odometry heading drifted up to 119 deg through tight turns and
    # gear changes, and the EKF followed the wheels - the car "arrived" at
    # obstacle 3 while really 1.25 m away.
    twist_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 1.0]

    gains:
      left_joint: {p: 100.0, i: 0.1, d: 5.0}
      right_joint: {p: 100.0, i: 0.1, d: 5.0}
