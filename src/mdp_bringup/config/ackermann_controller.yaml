controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 10.0
    # ackermann_steering_controller/steering_controllers_library expects RIGHT
    # joint first, then LEFT (confirmed in steering_controllers_library_parameters.hpp's
    # own parameter descriptor) - matches real_controller.yaml's fix. Verified live in
    # sim: with the old left-first order, the inner wheel spun FASTER than the outer
    # wheel during a turn (physically backwards).
    steering_joints_names: ['right_joint', 'left_joint']
    traction_joints_names: ['rb_joint', 'lb_joint']

    wheelbase: 0.1433
    steering_track_width: 0.104
    traction_track_width: 0.16
    steering_wheels_radius: 0.0325
    traction_wheels_radius: 0.0325

    open_loop: false
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_footprint

    cmd_vel_timeout: 10.0
    publish_limited_velocity: true
    use_stamped_vel: true

    # steering_controllers_library's own hardcoded default is
    # [0.0, 7.0, 14.0, 21.0, 28.0, 35.0] (vx, vy, vz, vroll, vpitch, vyaw) -
    # not a computed sensor-noise estimate, just index-numbered placeholder
    # values nobody had overridden. Confirmed live (2026-09-17): this made
    # ekf_sim.yaml's EKF report near-zero confidence in wheel-derived vyaw
    # (covariance 35 = huge uncertainty) and near-infinite confidence in vx
    # (covariance 0), so the fused yaw estimate barely tracked a real,
    # sustained slow turn at all - it leaned almost entirely on the IMU
    # input instead, regardless of what the wheels were actually doing.
    # Placeholder trust values below, same "unvalidated starting point"
    # caveat as this project's other covariance numbers (see ekf_sim.yaml/
    # ekf.yaml) - not measured against this chassis's actual encoder noise.
    #
    # vyaw (last entry) deliberately trusted MORE than the simulated IMU's
    # own covariance (1e-4, see mini_akm_robot.urdf's imu_sensor noise
    # model): confirmed live that with vyaw trusted less than or equal to
    # the IMU, a slow sustained turn (~0.01-0.02 rad/s, below the IMU's own
    # noise floor at that stddev) got its real, consistently-signed wheel
    # signal swamped by the IMU's noise-dominated near-zero-mean readings,
    # so the fused yaw stayed nearly flat while the real heading kept
    # changing. In sim, wheel-derived vyaw comes from ideal kinematics (no
    # real slip to model), so it genuinely deserves more trust than a noisy
    # gyro at low turn rates - this is a sim-specific weighting, not
    # necessarily correct for real hardware's actual encoder noise.
    twist_covariance_diagonal: [0.001, 0.01, 0.01, 0.01, 0.01, 0.00001]

    gains:
      left_joint: {p: 100.0, i: 0.1, d: 5.0}
      right_joint: {p: 100.0, i: 0.1, d: 5.0}
