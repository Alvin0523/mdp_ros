# Task 1 obstacle layout for development - the tablet's obstacle setup, as a file.
#
# ONE SOURCE for everything that needs obstacles (see scripts/obstacle_layout.py):
#   * the sim arena - mdp.launch.py bakes one Gazebo model per entry into the
#     world at launch (task1_arena.sdf itself has no obstacles),
#   * the planner - `pixi run setup` (or obstacles:=yaml at launch, the sim
#     default) publishes the set on /obstacle_setup, exactly as
#     bluetooth_bridge_node would after the tablet sent it.
#
# Obstacles are given by CELL, exactly like the tablet's 20x20 grid:
#   cell_x, cell_y: 0..19, 10 cm cells, cell (0,0) at the bottom-left.
#   The 10 cm block fills its cell, so its centre is ((c + 0.5) x 0.10) m -
#   cell (3,3) is the block centred on (0.35, 0.35) m. (Metres via `x:`/`y:`
#   still work, but cells are the convention.)
#   The robot starts in the 40 cm start box = cells 0..3 x 0..3.
# facing: N/E/S/W - which side of the block carries the image (the direction
#   the robot must face to see it), per docs/assessment_checklist.md B.1/C.5.
# symbol: sim only - models/symbols/<symbol>.obj decal on the facing side.
#
# A made-up layout for testing the pipeline end-to-end, NOT a competition
# layout - in the real run the supervisor's layout arrives from the tablet.
#
# id 4 was renumbered from 5 on 2026-09-24 so ids run 1-4 with no gap. The old
# id 4 (cell 9,18 facing E) was dropped 2026-09-17: 20 cm from the top wall, its
# checkpoint heading pointed into the wall with less than one turning radius
# (25.3 cm) of room, and Hybrid A* correctly found no path.

obstacles:
  - {id: 1, cell_x: 5,  cell_y: 10, facing: S, symbol: 20_AlphabetA}
  - {id: 2, cell_x: 12, cell_y: 4,  facing: W, symbol: 11_One}
  - {id: 3, cell_x: 17, cell_y: 15, facing: N, symbol: 36_ArrowUp}
  - {id: 4, cell_x: 15, cell_y: 9,  facing: S, symbol: 12_Two}
