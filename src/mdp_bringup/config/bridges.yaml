# The two serial links. Override a device at launch:
#   pixi run pi serial_port:=/dev/ttyACM0 bluetooth_device:=/dev/rfcomm1

serial_bridge_node:            # STM32 (real robot only)
  ros__parameters:
    # /dev/stm32_serial (the board's UART3 = the car link), not /dev/ttyACM0: the
    # number changes when another USB serial device is plugged in, this name never
    # does. Its other port, UART1, is /dev/stm32_flash (flashing + debug printf).
    # Made by the udev rule from mdp_stm32/udev (once per machine, board plugged in:
    # cd mdp_stm32 && pixi run udev).
    serial_port: /dev/stm32_serial
    baud_rate: 115200
    # s of telemetry averaged for the gyro bias on every `pixi run reset` (the
    # car must stand still) - see serial_bridge_node.cpp, gyro bias re-measure.
    # Measured on the Pi 2026-10-02 (6 min still): bias error 0.012 deg/s after
    # 2 s, 0.007 after 5 s, 0.005 after 10 s - ~1.1 / 0.6 / 0.4 deg of heading
    # over a 90 s run.
    gyro_zero_s: 5.0
    # IR distance per sensor: cm = a / (raw/4095)^b on the raw ADC value, [a, b].
    # pixi run calib ir, 2026-10-14, task 2 mounts, firmware averaging 8 conversions:
    # fitted on 10-30 cm (task 2 passes the faces at ~15 cm; the power law cannot also
    # hold 40 cm). IR1 within 0.6 cm at 10-25, -1.3 at 30 (that run had the old 10 s
    # countdown - redo it with Enter for a cleaner fit); IR2 within 0.1 cm at 10-30.
    # Both read 2-3 cm short at 40. (Before: [6.23, 1.210] / [6.53, 1.157], 2026-10-07,
    # task 1 mounts - up to 1.4 cm off at 13-25 on the new data.)
    # The STM32 sends raw (mean of 8 conversions); these curves are what the car uses.
    # mdp_stm32 src/ir.c IR*_DISPLAY_* is a copy for its OLED only - update it too
    # if the OLED should read the same as /ir and /ir2.
    ir1_curve: [6.69, 1.111]   # IR1, /ir, PC2 - task 2: right side (task 1: left, rear)
    ir2_curve: [6.95, 1.077]   # IR2, /ir2, PC1 - task 2: left side (task 1: left, front)
    ir_min_cm: 4.0             # clamp (Sharp readings are unreliable below ~7 cm)
    ir_max_cm: 80.0

bluetooth_bridge_node:         # the tablet (sim and real)
  ros__parameters:
    device: /dev/rfcomm0
    reopen_period_s: 1.0       # s between attempts to reopen a lost link
