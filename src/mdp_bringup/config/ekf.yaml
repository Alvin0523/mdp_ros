ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    use_sim_time: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    odom0: /ackermann_steering_controller/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
