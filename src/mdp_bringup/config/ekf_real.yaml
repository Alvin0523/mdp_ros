# Prep-only: not launched by real.launch.py yet. mdp_stm32 firmware has no
# IMU or encoder publishing implemented (still stubs), so there is nothing
# real for this EKF to consume. Kept in the same shape as ekf.yaml so wiring
# it into real.launch.py is a drop-in once the firmware side exists.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    use_sim_time: false

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true

    odom0: /ackermann_steering_controller/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
