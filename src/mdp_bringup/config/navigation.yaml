# Everything that DRIVES the car - the one place to change it:
#
#   SPEEDS AT A GLANCE (m/s)
#     task 1 path following    task1_runner  follower.desired_linear_vel   0.3 (reverse 0.3)
#     task 2                   task2_runner  straight_speed / path_speed   0.9 / 0.5
#     tablet arrow buttons     all nodes     manual_speed_mps              0.15
#
#   task1_runner  the car's outline and turning circles (like Nav2's footprint /
#                 minimum_turning_radius), costmap, Hybrid A* planner, path follower
#   task2_runner  task 2 speeds, swerve trigger, lane and waypoint distances
#   /**           the tablet's arrow buttons (manual_drive in task 0,
#                 task1_runner in task 1)
#
# The car's wheelbase and steering limits are NOT here: they are the URDF's
# (mdp_description/urdf/mdp_robot.urdf.xacro), and mdp.launch.py passes them
# in as robot.wheelbase / robot.steering_limit_*. task1_runner hands its
# settings to the planner library (mdp_algorithm utils/params.py), which reads
# this file + the URDF when used without ROS.
#
# Units: SI, as everywhere in ROS - metres, radians, seconds, m/s.
# Names: Nav2's where Nav2 has the same setting (costmap_2d inflation layer,
# Smac Hybrid-A* planner, Regulated Pure Pursuit controller).
#
# When a change takes effect: restart the launch - except the speeds, the
# lookaheads and the button settings, which are also read live:
#   ros2 param set /task1_runner follower.desired_linear_vel 0.3
#   ros2 param set /task2_runner straight_speed 0.35
#   ros2 param set /manual_drive manual_speed_mps 0.25
# Faster than the 0.2 m/s the turning circles were measured at means wider
# turns than planned - test in sim first.

task1_runner:
  ros__parameters:

    # ---------------------------------------------------------------- robot --
    # base_link = centre of the rear axle (REP-105 car convention).
    robot:
      # Body outline around base_link, measured on the car 2026-09-27: 230 mm
      # long with 31 mm behind the rear axle, 190 mm wide (outside of the tyres).
      footprint_rear: 0.031           # m behind base_link
      footprint_front: 0.199          # m ahead of base_link
      footprint_half_width: 0.095     # m each side

      # Nav2 minimum_turning_radius, per side: the circle the rear axle ACTUALLY
      # drives at full lock - MEASURED, not wheelbase / tan(angle) (that says
      # 0.154 / 0.225 m): with same-angle steering the tyres scrub and the car
      # turns wider. Measured in SIM 2026-09-27 (Gazebo ground truth, circle
      # fitted to the rear-axle track, 0.2 m/s).
      # TODO: replace with the REAL car's circles (full lock, slow full circle,
      # radius traced by the middle of the rear axle).
      minimum_turning_radius_left: 0.177    # m
      minimum_turning_radius_right: 0.257   # m

    # -------------------------------------------------------------- costmap --
    # One costmap of the 2 x 2 m arena (planning/costmap.py), published on
    # /occupancy_grid: blocks and everything outside the arena are LETHAL (254),
    # cells the car's base_link cannot reach without touching are INSCRIBED
    # (253), and an inflation layer spreads cost 252 -> 0 around them.
    costmap:
      resolution: 0.01                # m per costmap cell (the tablet's 10 cm
                                      # cells are too coarse for a 19 cm car)
      footprint_padding: 0.06         # m added on every side of the footprint
                                      # against BLOCKS (hard collision check).
                                      # 0.01: passed blocks at ~1 cm (sim hit);
                                      # 0.03: squeezed past (16,13)E at 3 cm and hit
                                      # it; 0.04: still ~4 cm past #8 (car, 2026-10-08).
      edge_padding: 0.02              # m kept from the TABLE EDGE instead: only a
                                      # line, nothing to hit - so in a gap between a
                                      # block and the edge the car runs nearer the edge.
      inflation_radius: 0.25          # m from a lethal cell over which cost is
                                      # spread. Nav2 advises >= the circumscribed
                                      # radius (base_link to the far front corner
                                      # of the padded footprint, 0.26 m now) so
                                      # the full footprint check can be skipped
                                      # far from obstacles; below it the check
                                      # always runs (slower, still correct).
      cost_scaling_factor: 15.0       # 1/m: cost = 252 * exp(-factor * (d - inscribed))

    # -------------------------------------------------------------- planner --
    # Hybrid A* with body-footprint collision (planning/hybrid_astar.py).
    planner:
      turning_radius_margin: 1.30     # plan turns this much wider than the
                                      # minimum, so the follower keeps steering
                                      # in reserve to correct errors
      step_size: 0.05                 # m, length of one motion primitive
      xy_search_resolution: 0.05      # m, one search state per cell of this size
      angle_quantization_bins: 72     # ... and per 5 deg of heading
      cost_penalty: 2.0               # Smac: step cost x (1 + cost_penalty * cost / 252)
      reverse_penalty: 1.5            # reverse steps cost this x forward
      change_penalty: 20.0            # per direction change (forward <-> reverse);
                                      # counted twice per change, so 40 per stop
      steering_change_penalty: 10.0   # per steering change (L/S/R)
      analytic_expansion_max_cost: 200      # reject a Reeds-Shepp shot to the goal that
                                            # passes a pose costlier than this (except
                                            # within 2 turning radii of the goal)
      analytic_expansion_max_length: 0.90   # m, try shots only this close to the goal
      analytic_expansion_interval: 10       # try a shot every N expansions (always
                                            # when closer than 0.4 m)
      max_iterations: 60000
      max_planning_time: 60.0         # s per leg
      goal_xy_tolerance: 0.035        # m, the path must end this close to the checkpoint
      goal_yaw_tolerance: 0.3491      # rad = 20 deg
      checkpoint_standoff: 0.30       # m, base_link stops this far from the
                                      # obstacle's centre, straight out from its
                                      # image face (planning/visiting_order.py).
                                      # 0.30, was 0.20 (2026-10-01): 0.20 left only
                                      # 5.5 cm between the car's side and the block at
                                      # every scan stop, less than the real car's
                                      # ~3 cm/leg position error that adds up over a
                                      # run; 0.30 leaves 15.5 cm. A multiple of the
                                      # 10 cm cell: checkpoints snap to cell centres, so
                                      # 0.25 snapped to 0.20 on some sides and was then
                                      # "too close to its own block" - unreachable.

    # ------------------------------------------------------------- follower --
    # Following the planned path (control/path_follower.py): path_tracking picks the steering.
    follower:
      lookahead_dist: 0.10            # m at 0.2 m/s (live)
      use_velocity_scaled_lookahead_dist: true   # above 0.2 m/s the lookahead
                                                 # grows with the speed
      desired_linear_vel: 0.3         # m/s (live), clamped to 0.05 - 0.5. Sim
                                      # 2026-09-30 (6 blocks, lqr + pose_latency):
                                      # 0.4 closest body gap 0.9-1.7 cm; 0.5 touched
                                      # (pure pursuit touched at 0.4 too).
                                      # Real car 2026-10-01: 0.2 - goto landed 0.7-1.5 cm
                                      # there; task 1 at 0.4 rolled ~20 cm past
                                      # checkpoints and arrived up to 61 deg off.
      xy_goal_tolerance: 0.03         # m, arrived at a checkpoint (Nav2 goal checker). Was 0.05:
                                      # car 2026-10-09, #1 "arrived" 4.5 cm short and crept 10 cm
      pose_latency: 0.09              # s - the EKF pose is this late. Gazebo
                                      # 2026-09-30: 0.06 (~2 cm behind the car at 0.3 m/s);
                                      # real car 2026-10-01: EKF yaw rate 80-96 ms behind
                                      # the raw gyro (5 full-lock turns, calib bags);
                                      # the follower moves it on by the last command
      # How it steers (live): pure_pursuit = at the point lookahead_dist ahead
      # (cuts inside curves: ~5 cm off the path at 0.3-0.5 m/s, sim 2026-09-30);
      # feedback = the planned path's own curvature at the nearest point, looked
      # up feedforward_preview_time ahead (the steering lag), plus corrections
      # for the sideways error (feedback_k_e) and heading error (feedback_k_theta).
      path_tracking: lqr              # pure_pursuit | feedback | lqr (see below).
                                      # Sim 2026-09-30 at 0.4 m/s: lqr worst 5.7-7.1 cm
                                      # off the path, pure_pursuit 10.6-10.8 cm
      feedback_k_e: 20.0              # 1/m^2 - bigger pulls back to the line harder
      feedback_k_theta: 16.0          # 1/m - bigger lines the heading up harder
      feedforward_preview_time: 0.15  # s
      # lqr: sideways error, heading error and the wheel angle (lagging its
      # command by steering_time_constant) in one small model; bigger weight =
      # that error matters more; lqr_r = how much big steering moves cost.
      lqr_q_lateral: 50.0             # per m^2 - 100 in sim (1 cm off -> ~9 deg of
                                      # steering); softer for the first real-car runs
                                      # (2026-10-01: at 100 on the old firmware it
                                      # swung lock-to-lock)
      lqr_q_heading: 30.0             # per rad^2
      lqr_q_steer: 0.1                # per rad^2 (wheel angle off the path's)
      lqr_r: 2.0                      # per rad^2 of steering command. 0.2 in sim; real
                                      # car 2026-10-01: 0.2 answered every bit of pose
                                      # noise (steering flipped lock to lock); 2.0 calms
                                      # it with the same tracking (simulated, measured
                                      # 0.22 s steering lag, 0.09 s pose delay)
      steering_time_constant: 0.22    # s - Gazebo 2026-09-30: 90% of a steering
                                      # step in ~0.5 s. TODO: measure the real car
      max_path_error: 0.06            # m - further than this off the planned path:
                                      # stop and plan the leg again from there (task 1)
                                      # or give up (goto). Real car 2026-10-01: lost the
                                      # path 14 cm and drove into two blocks.
      cusp_tolerance: 0.01            # m, drive this close to a direction change
                                      # before switching gear (RPP style)
      # Slow down where it is tight (Nav2 Regulated Pure Pursuit names; all
      # live). desired_linear_vel is the straight-line speed; curves are capped
      # at sqrt(max_lateral_accel x radius), reversing at max_reverse_linear_vel,
      # and it slows over the last approach_velocity_scaling_dist before every
      # direction change and checkpoint. Why: at 0.4 m/s flat out the car ran
      # 5.6 cm off its path reversing into a checkpoint and touched the block
      # (sim 2026-09-30).
      # OFF: tried in sim 2026-09-30 - the paths are nearly all curves (median
      # radius 0.33 m), so it held ~0.41 m/s everywhere and did not reduce the
      # worst drift (~5 cm at 0.3-0.5 m/s either way).
      # ON for the real car (2026-10-01): off, it arrives at full speed and rolls
      # on after the stop (~5 cm at 0.2 m/s, ~20 cm at 0.4) and reverses at full
      # speed (max_reverse_linear_vel only applies when this is on).
      use_regulated_linear_velocity_scaling: true
      max_lateral_accel: 0.25         # m/s^2 - full lock (~0.18 m) -> 0.21 m/s. Was 0.5
                                      # (0.30 at full lock): at 0.3 m/s the car skidded at
                                      # full lock - 9 cm of drift on one leg (2026-10-07)
      regulated_linear_scaling_min_speed: 0.15   # m/s, never slower in a curve
      max_reverse_linear_vel: 0.3     # m/s
      approach_velocity_scaling_dist: 0.12   # m - was 0.20 / 0.10 m/s: 9.7 s of a 55 s
      min_approach_linear_velocity: 0.15     # m/s   run under 0.12 m/s (car, 2026-10-08)
      # Task 1 scan stop: the straight creep to the block for the IR fix
      # (task1_runner.creep). At 0.10 m/s it stopped 2-3 cm off its target
      # (sim 2026-10-04); 0.05 within ~1 cm. TODO: does the real car move this slow?
      creep_linear_vel: 0.05            # m/s

    # ---------------------------------------------------------------- visit --
    # How the images are visited (mdp_algorithm planning/visit_plan.py).
    #   anchors  (default) fewer stops: ANCHORS stop square on (IR fix + scan); an
    #            image read from a path between them is a DRIVE-BY - read while
    #            driving, at drive_by_speed; an image no square stop fits gets an
    #            ANGLED stop (further back / turned, no IR fix); the last image an
    #            angled stop. A drive-by not read is visited at the end of the run.
    #   square   the old way: one square-on stop per image, an image no square stop
    #            fits is skipped - the competition runs up to 2026-10-17 Planned with
    #            Reeds-Shepp estimates (~0.2-0.5 s), then the legs with Hybrid A*.
    #            Offline on the 2026-10-14 tablet layout: 8 stops -> 4 + 4 drive-bys.
    visit:
      mode: square                    # anchors | square
      view_max_dist: 0.50             # m, camera -> image: "in view" (anchors mode)
      view_max_bearing: 0.436         # rad = 25 deg off the camera's axis (view +-31)
      view_max_incidence: 0.785       # rad = 45 deg: the face seen at most this oblique
      drive_by_min_view: 0.15         # m of path with the image in view, at least
      drive_by_speed: 0.2             # m/s while a drive-by image is in view (live)
      max_drive_bys_per_leg: 2        # between two stops - the position fixes stay close
      last_stop_max_angle: 0.611      # rad = 35 deg off square for the last stop

task2_runner:
  ros__parameters:
    # Speeds (live). The turning circles were measured at 0.2 m/s: faster turns
    # are wider - test in sim first.
    straight_speed: 0.90       # m/s, out of the carpark to obstacle 1, and straight parts of the planned path
                               # (1.05 tried 2026-10-16: cut 12-18 cm inside checkpoint 2, touched the bar)
    path_speed: 0.50           # m/s, the slowest: gear changes, arriving, the fallback swerve
    # The swerve round obstacle 1 (front ultrasonic reading to obstacle 1): as early
    # as possible - from swerve_early_dist once YOLO has read arrow 1, at the latest
    # at swerve_trigger_dist (waiting there if the arrow is still unread). It ends
    # parallel to the centre line, lane_offset to the side.
    swerve_early_dist: 0.90    # m
    swerve_trigger_dist: 0.45  # m
    lane_offset: 0.30          # m, checkpoint 1 (beside obstacle 1) out from the centre line: the car's
                               # side 15.5 cm from obstacle 1 - room for obstacle_padding 0.10 + the
                               # clean shapes' 4 cm spare beside it (0.25: 10.5 cm, every route failed)
    cp1_back: 0.40             # m, checkpoint 1 this far BEHIND obstacle 1's centre: the camera (17.1 cm
                               # ahead of the rear axle, URDF) 23 cm short of it - arrow 2 in view (19 deg at
                               # d2 = 0.6, half view 31; 23 with the real car's ~17 cm overshoot) and obstacle
                               # 1 not (it comes in > 33 cm before its near face); level with it the camera
                               # saw nothing (bag 2026-10-15 20:38). No room for the S at d1 0.6 / 0.7: then
                               # 10 cm nearer at a time (task2_runner cp1_lined_up).
    side_clearance: 0.25       # m, checkpoints 2 and 3 out from obstacle 2's ends (as lane_offset): mid the
                               # 50 cm to a side wall (side_wall_clearance)
    home_stop_dist: 0.15       # m, ultrasonic reading of the carpark's back wall = stop (first rule;
                               # 0.12 until 2026-10-16)
    home_straight_dist: 0.45   # m, on the centre line before home: the car lines up this far out
    home_margin: 0.08          # m of extra room either side on the way home (it passes obstacle 1;
                               # the other legs keep 0.04). 0.12 (2026-10-16) left no clean S through the
                               # carpark's entrance in any of 240 layouts: Hybrid A*, a zigzag past
                               # obstacle 1; 0.08: all 240, >= 16 cm from obstacle 1
    line_up_dist: 0.30         # m, straight into checkpoints 1 and 2: the diagonal ends this far before
                               # (0.3 + side_clearance 0.25 gave the most clean diagonals, 24 of 36
                               # layouts, in an offline search 2026-09-30; the rest use Hybrid A*)
    brake_decel: 1.20          # m/s^2 the speed profile brakes at, for curves, gear changes and path ends
                               # (1.4 tried 2026-10-16: checkpoint 2 arrived 12 cm off on average vs 7)
    ir_pass_speed: 0.60        # m/s while an IR passes obstacle 1's side / a bar end (enough readings for a fix)
    max_lateral_accel: 1.00    # m/s^2: curve speed = sqrt(this x radius), path_speed..straight_speed.
                               # 1.5: the tightest turn (~33 cm) at 0.70 m/s overshot the straighten-up
                               # into checkpoint 1, 30 deg off (car 2026-10-14); 1.0: 0.57 m/s there
    path_tracking: lqr         # pure_pursuit | lqr (task1_runner follower.* has the lqr weights)
    pose_latency: 0.09         # s, the EKF pose's delay the follower allows for (task 1: 0.06)
                               # (sim 2026-10-10 with these four: 8.4-10.8 s, closest gap 8.8 cm over 4 layouts)
    ir_fix: false              # IR position fixes past obstacle 1's side and the bar's ends (live;
                               # false = dead reckoning only). Off by default: CP1 -> CP2 is now placed
                               # from the bar as the car sees it at checkpoint 1 (bullseye + ultrasonic)
    obstacle_padding: 0.10     # m kept between the car's outline and the obstacles when planning,
                               # task 2 only (task 1: costmap.footprint_padding). Was 0.06 for walls
                               # and obstacles alike: the car's inside rear corner cut ~8 cm into it
                               # turning right just past obstacle 1 and passed it at 2.1 cm (sim
                               # 2026-10-14, d2 0.6 L/R)
    obstacle_1_padding: 0.15   # m kept before and behind obstacle 1 (beside it: obstacle_padding, the
                               # lane): leg 1 crossing behind it toward arrow 2's side passed its
                               # corner 0-5 cm off and hit it once (bags 2026-10-15)
    wall_padding: 0.06         # m kept from the walls (carpark, the side walls by the bar)
    # Forward only: the legs are planned without reversing, and the follower never reverses
    # on its own (it backed up after checkpoint 1, car 2026-10-14). Only when the car has
    # not moved for stuck_time s while told to drive may it reverse.
    stuck_time: 1.0            # s
    # The bar's width at checkpoint 1: arrow 2 (mid-bar) and the bullseye on the bar's near
    # end in one frame (YOLO class 99, or the laptop's bullseye_matcher) x the ultrasonic.
    camera_hfov: 1.089         # rad, the camera's horizontal view (Pi camera v2 full sensor ~62 deg;
                               # the sim camera is the same, URDF)
    bar_gap_scale: 1.065       # x the arrow 2 -> bullseye gap: the real lens (barrel distortion) shows it
                               # ~6.5% short - 60 and 76.3 cm bars measured 55.6 / 71 with the ultrasonic's
                               # distance right (car 2026-10-15). Not in sim (a pinhole camera). Live
    cp1_speed: 0.60            # m/s on the straight into checkpoint 1 (0.50 until 2026-10-16; may be below
                               # path_speed): steady while the ultrasonic and the camera read obstacle 2 -
                               # at 0.9 it arrived still turning and wiggled +-15 deg (bags 2026-10-15)
    # Hybrid A* for a leg no clean shape and no route table covers: on the laptop
    # (leg_planner), here if it does not answer within this.
    remote_plan_timeout: 2.0   # s

# The tablet's arrow buttons (f b fl fr bl br): a short burst, then stop.
# Every node loading this file gets them - manual_drive (task 0) and
# task1_runner (task 1, while idle).
/**:
  ros__parameters:
    manual_speed_mps: 0.15     # m/s, clamped 0.05 - 0.5 (live)
    manual_steer_deg: 25.0     # deg of wheel angle for fl/fr/bl/br, clamped 5 - 30 (live)
    manual_burst_s: 0.3        # s per press, clamped 0.1 - 1.0 (live)
