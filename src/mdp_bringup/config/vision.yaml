# Camera + YOLO (launch/vision.launch.py). The model and the image topic YOLO
# reads are launch arguments (model:=, camera_topic:=), not set here.

rpi_cam_publisher:             # the Pi camera (real robot only; Gazebo has its own)
  ros__parameters:
    image_width: 640
    image_height: 480
    frame_rate: 15.0           # scan stops need ~3 frames: 15 fps ~0.75 s a stop (10: ~0.85 s); 30 wasted Pi CPU
    camera_topic: /image_raw
    jpeg_quality: 95     # the copy YOLO reads on the laptop: 95 keeps letter edges clean (~80 KB a frame)
    # Full-sensor mode (IMX219 1640x1232, binned) scaled to the image size: the
    # whole ~62 deg view. Auto ('') picks the cropped 640x480 mode - a narrow view.
    # Check the modes on the Pi: rpicam-hello --list-cameras
    sensor_mode: "1640:1232:10:P"

yolo_detector:
  ros__parameters:
    result_topic: /yolo_result
    annotated_topic: /yolo_result/image_annotated
    jpeg_quality: 80
    # When YOLO sees several symbols, /yolo_result gets ONE: confidence at least
    # min_confidence (Ultralytics' default was 0.25), not cut off by the frame edge
    # (edge_margin_px; used only if nothing else is seen), and the BIGGEST = the
    # closest (all symbols are one size). Foxglove's annotated image marks it SENT.
    min_confidence: 0.3        # 0.5 until 2026-10-16 (task 2 bullseyes still need 0.70 for the width)
    edge_margin_px: 3

# Task 2's bullseyes by template matching (mdp_vision bullseye_matcher) until YOLO
# has a bullseye class: boxes on /bullseye_detections, like /yolo_detections.
bullseye_matcher:
  ros__parameters:
    min_px: 11.0               # bullseye sizes searched (px, its white square): ~12 px at 2.1 m (the farthest
                               # the runner uses, 0.6 m before checkpoint 1), ~75 px at 0.5 m. Small false
                               # matches on the walls' texture are dropped by the runner (score < 0.7)
    max_px: 140.0
    threshold: 0.6             # TM_CCOEFF_NORMED score for a match
