# Camera + YOLO (launch/vision.launch.py). The model and the image topic YOLO
# reads are launch arguments (model:=, camera_topic:=), not set here.

rpi_cam_publisher:             # the Pi camera (real robot only; Gazebo has its own)
  ros__parameters:
    image_width: 640
    image_height: 480
    frame_rate: 30.0
    camera_topic: /image_raw
    jpeg_quality: 80
    # Full-sensor mode (IMX219 1640x1232, binned) scaled to the image size: the
    # whole ~62 deg view. Auto ('') picks the cropped 640x480 mode - a narrow view.
    # Check the modes on the Pi: rpicam-hello --list-cameras
    sensor_mode: "1640:1232:10:P"

yolo_detector:
  ros__parameters:
    result_topic: /yolo_result
    annotated_topic: /yolo_result/image_annotated
    jpeg_quality: 80
