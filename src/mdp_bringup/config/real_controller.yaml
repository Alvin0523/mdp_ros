controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 10.0
    # ackermann_steering_controller/steering_controllers_library expects
    # RIGHT joint first, then LEFT (confirmed directly in
    # steering_controllers_library_parameters.hpp's own parameter
    # descriptor: "the expected order is: right joint, left joint") - both
    # lists were backwards ([left, right]) until 2026-09-03, confirmed by
    # hardware test: the inner wheel was spinning faster than the outer
    # wheel during a turn, which is physically backwards (outer wheel must
    # always be faster - same reason a car has a differential).
    steering_joints_names: ['right_joint', 'left_joint']
    traction_joints_names: ['rb_joint', 'lb_joint']

    wheelbase: 0.1433
    steering_track_width: 0.104
    traction_track_width: 0.16
    steering_wheels_radius: 0.0325
    # MEASURED 2026-09-21 (tape vs odometry, 4 runs of a commanded 2.0 m:
    # 203.6/203.7/203.6/203.6 cm): the car travels 1.018x what 0.0325 m
    # predicts, so the effective rolling radius is 0.0325 * 1.018 = 0.03309 m
    # (tyre thickness). Ticks per rev (1560) were separately confirmed by
    # hand-rotation and a mark-return test, so this is the radius, not the ticks.
    traction_wheels_radius: 0.03309

    open_loop: false
    # robot_localization's ekf_node is the single odom->base_footprint TF
    # broadcaster now (see mdp_bringup/config/ekf.yaml) - leaving this true
    # as well would mean two nodes fighting over the same transform.
    # /ackermann_steering_controller/odometry is still published either way;
    # this only disables its own TF broadcast.
    enable_odom_tf: false
    odom_frame_id: odom
    base_frame_id: base_footprint

    cmd_vel_timeout: 10.0
    publish_limited_velocity: true
    use_stamped_vel: true

    # steering_controllers_library's own hardcoded default is
    # [0.0, 7.0, 14.0, 21.0, 28.0, 35.0] (vx, vy, vz, vroll, vpitch, vyaw) -
    # not a computed sensor-noise estimate, just index-numbered placeholder
    # values nobody had overridden. Confirmed live in sim (2026-09-17, same
    # controller code path real hardware uses): this made ekf.yaml's EKF
    # report near-zero confidence in wheel-derived vyaw (covariance 35 = huge
    # uncertainty) and near-infinite confidence in vx (covariance 0), so the
    # fused yaw estimate barely tracks a real, sustained slow turn at all -
    # it leans almost entirely on the IMU input instead, regardless of what
    # the wheels are actually doing. Placeholder trust values below, same
    # "unvalidated starting point" caveat as this project's other covariance
    # numbers (see ekf.yaml) - not measured against this chassis's actual
    # encoder noise. Re-verify on real hardware once it's up again.
    #
    # Left uniform here rather than trusting vyaw more than the IMU the way
    # ackermann_controller.yaml (sim) does: that rebalancing relies on sim's
    # wheel-derived vyaw coming from ideal kinematics with no real slip to
    # model, which does not hold on real hardware. Real encoder noise vs.
    # real ICM-20948 gyro noise needs its own bench comparison before
    # trusting one over the other here.
    # vyaw (last entry) raised 0.01 -> 1.0 on 2026-09-21: wheel-odometry yaw
    # over-read by 9% on a physical 180 deg turn (191.4 deg vs ~175 real),
    # because it uses the commanded steering angle as the real wheel angle,
    # while the gyro read 177.4 deg. With equal 0.01 covariances the EKF
    # averaged them (182 deg). 1.0 makes the EKF lean on the gyro for yaw rate;
    # wheel odometry still supplies vx and acts as a fallback if the IMU drops.
    twist_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 1.0]

    gains:
      left_joint: {p: 100.0, i: 0.1, d: 5.0}
      right_joint: {p: 100.0, i: 0.1, d: 5.0}
