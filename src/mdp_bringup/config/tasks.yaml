# Obstacle layouts - ONE file for Gazebo AND the planners. Change a block here
# and relaunch: the sim arena and the runner both get it.
#
#   task1  mdp.launch.py builds the Gazebo arena with these blocks, and (with
#          obstacles:=yaml, the sim default, or `pixi run setup`) publishes them
#          on /obstacle_setup exactly as the tablet's bridge would. In a real
#          run the tablet sends the layout; in sim, a tablet layout that differs
#          from this one replaces the Gazebo blocks too (sim_obstacles).
#   task2  the course rules (sizes, carpark) for task2_runner, and a sim-only
#          layout (distances, arrows) that builds the Gazebo arena.
#
# Another file: `pixi run sim task:=1 layout:=/path/my_tasks.yaml`.

task1:
  # By CELL, exactly like the tablet's 20 x 20 grid: cell_x, cell_y 0..19,
  # 10 cm cells, (0, 0) bottom-left. The 10 cm block fills its cell, so cell
  # (3, 3) is the block centred on (0.35, 0.35) m. The car starts in the 40 cm
  # start box = cells 0..3 x 0..3.
  # facing: N/E/S/W - the side of the block with the image.
  # symbol: sim only - models/symbols/<symbol>.obj printed on that side.
  # A made-up layout for testing, NOT a competition layout.
  obstacles:
    - {id: 1, cell_x: 6,  cell_y: 10, facing: E, symbol: 20_AlphabetA}
    - {id: 2, cell_x: 13, cell_y: 5,  facing: N, symbol: 11_One}
    - {id: 3, cell_x: 16, cell_y: 15, facing: W, symbol: 36_ArrowUp}
    - {id: 4, cell_x: 15, cell_y: 10, facing: S, symbol: 12_Two}
    - {id: 5, cell_x: 9,  cell_y: 16, facing: S, symbol: 13_Three}
    - {id: 6, cell_x: 9,  cell_y: 6,  facing: E, symbol: 22_AlphabetC}

task2:
  # KNOWN IN ADVANCE (the course rules) - task2_runner uses these.
  # Frame: x along the course (carpark -> obstacles), y across; the centre line
  # (carpark centre, both obstacles) is y = 1.20 m. The carpark's back wall
  # (inside face) is at x = 0.10 m, so everything has positive coordinates.
  carpark:
    width: 0.60         # inside, across (y)
    depth: 0.50         # inside, along (x) - the opening is at x = 0.10 + depth
    wall: 0.10          # thickness of every wall (carpark and the side walls by obstacle 2)
    height: 0.10
  obstacle_1: {size: [0.10, 0.10, 0.20]}   # x (along), y (across), z - every obstacle 10 cm thick
  obstacle_2: {size: [0.10, 0.60, 0.20]}   # the bar, centred on the centre line
  side_wall_clearance: 0.50                # walls may stand this far out from obstacle 2's ends

  # SIM ONLY - this test's layout. Builds the Gazebo arena; task2_runner never
  # reads it (on the real run d1, d2 and the arrows are unknown until measured).
  sim:
    d1: 1.00            # carpark opening -> obstacle 1's near face, 0.60-1.50 m
    d2: 1.00            # obstacle 1's far face -> obstacle 2's near face, 0.60-1.50 m
    arrow_1: LEFT       # LEFT / RIGHT - which way round each obstacle
    arrow_2: RIGHT
    side_walls: true    # walls side_wall_clearance out from obstacle 2's ends
