[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Workspace
build = "colcon build --symlink-install"
test = "colcon test"
clean = "rm -rf build install log"

# Simulation (Gazebo)
sim = "ros2 launch mdp_bringup sim.launch.py"
sim-task2 = "ros2 launch mdp_bringup task2_sim.launch.py"

# Real hardware (Pi + STM32)
real = "ros2 launch mdp_bringup real.launch.py serial_port:=/dev/ttyACM0"
task1 = "ros2 run mdp_control task1_runner.py"
task2 = "ros2 run mdp_control task2_runner.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true"

# Vision & debugging
vision = "ros2 launch mdp_vision vision.launch.py"
# use_sim_time defaults false (real hardware has no /clock); when pairing
# with `sim`/`sim-task2`, override with: pixi run foxglove use_sim_time:=true
foxglove = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml"
# records every topic into a timestamped dir under bags/. -a and explicit
# topics are mutually exclusive in ros2 bag, so for specific topics only,
# run directly instead: pixi run ros2 bag record -o bags/mybag /yolo_result
bag = "ros2 bag record -a -o bags/rosbag2_$(date +%Y%m%d_%H%M%S)"

[dependencies]
# Core ROS2
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-teleop-twist-keyboard = "*"

# ros2_control stack (framework, controllers, simulation & real hardware plugins)
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-topic-based-ros2-control = "*"

# Visualization & bridge
ros-jazzy-ros-gz = "*"
ros-jazzy-foxglove-bridge = "*"

# Sensor fusion (wheel odometry + IMU -> /odometry/filtered)
ros-jazzy-robot-localization = "*"

# Path planning (spline-based waypoint smoothing for task2)
scipy = "*"

# Vision & camera stack
ros-jazzy-cv-bridge = "*"
opencv = "*"
# Pin the BLAS backend numpy/torch resolve to, away from conda-forge's default
# `nvpl` (NVIDIA Performance Libraries) variant. nvpl targets SVE-capable
# server ARM (Grace/Graviton), NOT a Raspberry Pi 4B's Cortex-A72 - loading
# it there SIGILLs (illegal instruction) on first YOLO inference, after the
# model itself loads fine. openblas is broadly ARM/x86-compatible. See
# docs/pi-camera-vision.md "Known open issues" #1 for the original diagnosis.
libblas = { version = "*", build = "*openblas" }
liblapack = { version = "*", build = "*openblas" }

# Build tools (colcon-common-extensions provides the colcon CLI itself;
# compilers + cmake are needed for the CMake-based packages: wayp_plan_tools,
# mdp_hardware_bridge, mdp_bringup, mdp_description)
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"

[target.linux-aarch64.dependencies]
# libcamera + camera_ros build deps (Raspberry Pi camera capture, built from
# source in src/ rather than as prebuilt ros-jazzy-camera-ros/-libcamera
# packages, since those pull in a broken aarch64 dependency chain)
meson = "*"
pkg-config = "*"
colcon-meson = "*"
yaml = "*"
pyyaml = "*"
ply = "*"
jinja2 = "*"
gnutls = "*"
openssl = "*"
libtiff = "*"
libudev = "*"
# camera_ros's own ROS dependencies
ros-jazzy-camera-info-manager = "*"
ros-jazzy-image-transport = "*"

[pypi-dependencies]
ultralytics = "*"

[activation]
scripts = ["install/setup.bash"]

[activation.env]
ROS_DOMAIN_ID = "0"
# Both names are read by libgz-sim8 itself (GZ_SIM_* is current, IGN_GAZEBO_*
# is a legacy fallback it still checks) to find libgz_ros2_control-system.so,
# which installs straight into lib/ rather than gz-sim's default plugin path.
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
IGN_GAZEBO_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
