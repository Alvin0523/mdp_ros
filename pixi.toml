[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# --- Workspace ---------------------------------------------------------------
build = { cmd = "colcon build --symlink-install", description = "Build all packages" }
test = { cmd = "colcon test", description = "Run the package tests" }
clean = { cmd = "rm -rf build install log", description = "Delete build, install and log folders" }

# --- Robot bringup: ONE launch for real and sim (launch/mdp.launch.py) --------
# All options are launch arguments, appended to any of these:
#   pixi run real                                bare car: no task runner, no camera
#   pixi run real task:=1                        task 1 runner (tablet, planning, status)
#   pixi run real task:=2 vision:=true           task 2 runner + camera and YOLO
#   pixi run sim task:=1                         the same in Gazebo (laptop)
#   pixi run sim task:=1 obstacles:=tablet       Gazebo, obstacles only from the real tablet
#   obstacles:=tablet|yaml  layout:=<cells.yaml>  gui:=false (sim)
#   start_x start_y start_yaw  serial_port:=/dev/ttyACM0  bluetooth_device:=/dev/rfcomm0
real = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=false serial_port:=/dev/ttyACM0", description = "Real robot bringup. Args: task:=0|1|2 vision:=true|false obstacles:=tablet|yaml start_x start_y start_yaw serial_port bluetooth_device" }
drive = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=false serial_port:=/dev/ttyACM0 task:=0 vision:=false", description = "Alias: bare car (no runner, no camera) for motion tests" }
sim = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=true", description = "Gazebo bringup, same args as real (+ gui:=false)" }
sim1 = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=true task:=1", description = "Alias: Gazebo task 1" }
sim2 = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=true task:=2", description = "Alias: Gazebo task 2" }
vision = { cmd = "ros2 launch mdp_vision vision.launch.py", description = "Camera and YOLO only, no robot" }

# --- Run control (same for real and sim; reset works on any bringup; setup/go/stop need task:=1)
setup = { cmd = "ros2 run mdp_bringup publish_test_obstacles.py", description = "Publish the test obstacle set (cells, from test_obstacles.yaml)" }
reset = { cmd = "ros2 run mdp_bringup trigger.py /reset_pose", description = "Reset the EKF pose to the start pose (base bringup, any task)" }
go = { cmd = "ros2 run mdp_bringup trigger.py /start_run", description = "Start the planned run (like the tablet's BEGIN)" }
stop = { cmd = "ros2 run mdp_bringup trigger.py /stop_run", description = "Stop the run and hold zero velocity" }
status = { cmd = "ros2 topic echo /run_status mdp_interfaces/msg/RunStatus", description = "Live task-1 state (mdp_interfaces/RunStatus, 2 Hz): target, checkpoint, distance, chased waypoint, FWD/REV, cmd, scan/YOLO" }
runlog = { cmd = "ros2 topic echo /run_log rcl_interfaces/msg/Log --field msg", description = "Task logic events: GO, leg -> obstacle/checkpoint, arrived, YOLO, TARGET, next, finished, stop" }
btlog = { cmd = "ros2 topic echo /bt_log rcl_interfaces/msg/Log --field msg", description = "Tablet link traffic (LINK UP/DOWN, TABLET -> RPI, RPI -> TABLET)" }
guard = { cmd = "ros2 run mdp_bringup grid_guard.py", description = "TEMP: stop when off the 20x20 tablet grid" }

target = { cmd = "ros2 run mdp_bringup send_target.py", description = "Debug: send TARGET,<obstacle>,<id> to the tablet: target 2 20" }

# --- Motion tests (bare car: pixi run drive) ---------------------------------
dist = { cmd = "ros2 run mdp_bringup drive_distance.py", description = "Drive a straight distance: dist <m> [--speed m/s] [--steer-deg deg]" }
rotate = { cmd = "ros2 run mdp_bringup rotate_angle.py", description = "Turn by an angle: rotate <deg> [--direction left|right]" }
circle = { cmd = "ros2 run mdp_bringup circle_obstacle.py", description = "Approach an obstacle and go around it: circle [--right-only|--full]" }
teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true", description = "Keyboard driving" }

# --- Viewing and recording ---------------------------------------------------
foxglove = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml", description = "Foxglove bridge (ws://<pi>:8765, display frame: map)" }
bag = { cmd = "ros2 bag record --exclude-regex '/image_raw.*|/yolo_result/image_annotated' -o bags/rosbag2_$(date +%Y%m%d_%H%M%S) -a", description = "Record all topics except camera images" }
bag-all = { cmd = "ros2 bag record -a -o bags/rosbag2_$(date +%Y%m%d_%H%M%S)", description = "Record everything, including camera images (large)" }

# --- Sim assets ---------------------------------------------------------------
panels = { cmd = "python src/mdp_description/scripts/gen_symbol_meshes.py", description = "Generate the symbol panel meshes" }
import-symbols = { cmd = "python src/mdp_description/scripts/import_symbol_textures.py", description = "Import the symbol textures" }

[dependencies]
# Core ROS2 & Control
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-topic-based-ros2-control = "*"

# Telemetry & Sensor Fusion
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-robot-localization = "*"

# Planning & Math
scipy = "*"
numpy = "*"
pyyaml = "*"

# Vision Runtime
ros-jazzy-cv-bridge = "*"
# opencv = "*"
# libblas = { version = "*", build = "*openblas" }
# liblapack = { version = "*", build = "*openblas" }

# Build Tools
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
hypothesis = ">=6.168.1,<7"

[pypi-dependencies]
ultralytics = "*"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cpu" }
ncnn = "*"

# ---------------------------------------------------------------------------
# Laptop-only targets (Simulation, GUI testing, Model conversion)
# ---------------------------------------------------------------------------
[target.linux-64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.linux-64.pypi-dependencies]
pnnx = "*"

[target.osx-arm64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.osx-arm64.pypi-dependencies]
pnnx = "*"

[activation]
scripts = ["install/setup.bash"]

[activation.env]
ROS_DOMAIN_ID = "0"
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
