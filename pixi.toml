[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# DYLD_LIBRARY_PATH: macOS only (docs: Troubleshooting)

# Workspace
build = { cmd = "colcon build --symlink-install", description = "Build all packages" }
test = { cmd = "colcon test", description = "Run the package tests", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
clean = { cmd = "rm -rf build install log", description = "Delete build/ install/ log/" }
realtime = { cmd = "scripts/realtime/install.sh", description = "Pi, once: allow real-time priority (sudo, log in again after)" }

# Run (docs: Quickstart)
pi = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=false role:=pi", description = "Real car, the car's half (on the Pi) - with `laptop`", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
laptop = { cmd = "ros2 launch mdp_bringup mdp.launch.py role:=laptop", description = "The laptop's half: YOLO, leg planning, monitors, bags", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
sim = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=true", description = "Gazebo, the car's half - with `laptop sim:=true`", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
car = { cmd = "bash scripts/car.sh real", description = "Real car: Pi + laptop + Foxglove in one zellij window [launch args]" }
sim-car = { cmd = "bash scripts/car.sh sim", description = "Sim: the same split in one zellij window [launch args]" }
vision = { cmd = "ros2 launch mdp_bringup vision.launch.py", description = "Camera + YOLO only, no car", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }

# Run control
setup = { cmd = "ros2 run mdp_bringup trigger /setup_obstacles", description = "Send tasks.yaml's obstacles (= tablet DONE / Foxglove SETUP)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
block = { cmd = "ros2 run mdp_bringup publish_obstacles --block", description = "Task 1 with a few blocks: block COL ROW N|E|S|W ...", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
reset = { cmd = "ros2 run mdp_bringup trigger /reset_pose", description = "Reset the pose to the start (= tablet RESET)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
start = { cmd = "ros2 run mdp_bringup trigger /start_run", description = "Start the run (= tablet / Foxglove START)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
step = { cmd = "ros2 run mdp_bringup step", description = "Step-through (car with step:=true): SPACE next, s E-STOP", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
stop = { cmd = "ros2 run mdp_bringup trigger /stop_run", description = "Emergency stop (= tablet STOP / Foxglove E-STOP)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }

# Watch and record
foxglove = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml", description = "Foxglove bridge (ws://<host>:8765)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
status = { cmd = "ros2 topic echo /run_status mdp_interfaces/msg/RunStatus", description = "Live task 1 state (/run_status)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
btlog = { cmd = "ros2 run mdp_bringup bt_monitor --ros-args -r __node:=bt_monitor_view", description = "Tablet link traffic", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
bag = { cmd = "ros2 run mdp_bringup trigger /bag/toggle", description = "Start / stop a bag (= Foxglove REC)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
bag-all = { cmd = "ros2 bag record -a -o bags/rosbag2_$(date +%Y%m%d_%H%M%S)", description = "Record everything, camera images too", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
capture = { cmd = "ros2 run mdp_bringup capture", description = "Record the camera as MP4 for Roboflow (datasets/videos/)", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }

# Calibration and tools
calib = { cmd = "ros2 run mdp_bringup calib", description = "Calibrate: straight | rotate | turn | goto | ultrasonic | ir", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
around-obstacle = { cmd = "ros2 run mdp_bringup around_obstacle", description = "Checklist: drive a square round a block", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true", description = "Keyboard driving", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/mdp_interfaces/lib" } }
task2-table = { cmd = "ros2 run mdp_bringup task2_table", description = "Task 2: rebuild the CP1 -> CP2 route table" }

# Sim assets
panels = { cmd = "python src/mdp_description/scripts/gen_symbol_meshes.py", description = "Sim: generate the symbol panel meshes" }
import-symbols = { cmd = "python src/mdp_description/scripts/import_symbol_textures.py", description = "Sim: import the symbol textures" }

# YOLO
export-coreml = { cmd = "python scripts/yolo/export_coreml.py && colcon build --symlink-install --packages-select mdp_vision", description = "Mac, once per model: YOLO -> CoreML [model.pt] [--int8]" }
bench-yolo = { cmd = "python scripts/yolo/bench_yolo.py", description = "Time YOLO on every backend here" }

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-topic-based-ros2-control = "*"
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-robot-localization = "*"
ros-jazzy-cv-bridge = "*"
scipy = "*"
numpy = "*"
pyyaml = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
hypothesis = ">=6.168.1,<7"

# torch per machine: docs, RPi overview
[pypi-dependencies]
ultralytics = "*"

[target.linux-64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.linux-64.pypi-dependencies]
pnnx = "*"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cu128" }

[target.linux-aarch64.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cpu" }

[target.osx-arm64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.osx-arm64.pypi-dependencies]
pnnx = "*"
torch = "==2.8.0"
torchvision = "==0.23.0"
coremltools = "*"

[activation]
scripts = ["install/setup.bash", "scripts/activate_rmw.sh"]

# A target's scripts replace the list above
[target.linux-64.activation]
scripts = ["install/setup.bash", "scripts/activate_rmw.sh", "scripts/activate_gpu.sh"]

# Pi <-> laptop discovery, other links' addresses: docs, Network
[activation.env]
ROS_DOMAIN_ID = "14"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_STATIC_PEERS = "100.102.151.31;100.87.142.86"
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"

# Pi: OpenMP threads sleep instead of spinning (docs, RPi overview)
[target.linux-aarch64.activation.env]
OMP_WAIT_POLICY = "PASSIVE"
