[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# --- Workspace ---------------------------------------------------------------
build = { cmd = "colcon build --symlink-install", description = "Build all packages" }
test = { cmd = "colcon test", description = "Run the package tests" }
clean = { cmd = "rm -rf build install log", description = "Delete build, install and log folders" }

# --- Robot bringup: ONE launch for real and sim (launch/mdp.launch.py) --------
# Settings: src/mdp_bringup/config/ (planner, controller, ekf, bridges, vision,
# tasks). All options are launch arguments, appended to either:
#   pixi run real                                bare car: no task runner (camera + YOLO on)
#   pixi run real task:=1                        task 1: tablet, planning, camera + YOLO
#   pixi run real vision:=false                  without camera + YOLO (vision is on by default)
#   pixi run sim task:=2                         task 2 in Gazebo (laptop)
#   pixi run sim task:=1 obstacles:=tablet       Gazebo, obstacles only from the tablet
#   task:=0|1|2  vision:=true|false  model:=mdp_v1_ncnn_model  obstacles:=tablet|yaml
#   layout:=<tasks.yaml>  start_cell:=1,1  start_dir:=N  gui:=false (sim)  log:=full
#   serial_port:=...  bluetooth_device:=...      (default: config/bridges.yaml)
real = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=false", description = "Real robot bringup. Args: task:=0|1|2 vision:=true|false obstacles:=tablet|yaml start_cell:=COL,ROW start_dir:=N|E|S|W" }
car = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=false role:=car", description = "On the Pi, with the laptop running `pixi run base`: the robot without YOLO. Same args as real" }
base = { cmd = "ros2 launch mdp_bringup mdp.launch.py role:=base", description = "On the laptop, with the Pi running `pixi run car`: YOLO on the Pi camera's JPEG frames. Sim: `pixi run sim role:=car ...` + `pixi run base sim:=true`. Args: model:=..." }
sim = { cmd = "ros2 launch mdp_bringup mdp.launch.py sim:=true", description = "Gazebo bringup, same args as real (+ gui:=false)" }
vision = { cmd = "ros2 launch mdp_bringup vision.launch.py", description = "Camera and YOLO only, no robot" }

# --- Run control (same for real and sim; reset works on any bringup; setup/go/stop need task:=1)
setup = { cmd = "ros2 run mdp_bringup publish_obstacles", description = "Publish the task 1 obstacles from config/tasks.yaml (like the tablet), optional path: setup my_tasks.yaml" }
reset = { cmd = "ros2 run mdp_bringup trigger /reset_pose", description = "Reset the EKF pose to the start pose (base bringup, any task)" }
go = { cmd = "ros2 run mdp_bringup trigger /start_run", description = "Start the planned run (like the tablet's BEGIN)" }
stop = { cmd = "ros2 run mdp_bringup trigger /stop_run", description = "Stop the run and hold zero velocity" }
status = { cmd = "ros2 topic echo /run_status mdp_interfaces/msg/RunStatus", description = "Live task-1 state (mdp_interfaces/RunStatus, 2 Hz): target, checkpoint, distance, chased waypoint, FWD/REV, cmd, scan/YOLO" }
btlog = { cmd = "ros2 run mdp_bringup bt_monitor --ros-args -r __node:=bt_monitor_view", description = "Tablet link traffic: LINK UP/DOWN, TABLET -> RPI, RPI -> TABLET (add --all for the 2 s repeats)" }


# --- Calibration and tests (bare car: pixi run real / pixi run sim) ----------
calib = { cmd = "ros2 run mdp_bringup calib", description = "Calibrate (rows go to calibration_log.csv): calib straight 2.0 [--speed 0.9] | rotate 90 | turn left|right [--speed 0.35] | goto COL ROW N|E|S|W | ultrasonic CM  (-h for options)" }
around-obstacle = { cmd = "ros2 run mdp_bringup around_obstacle", description = "Checklist: approach a block on the ultrasonic and drive a square round it [--direction right]" }
teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true", description = "Keyboard driving" }

# --- Viewing and recording ---------------------------------------------------
foxglove = { cmd = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml", description = "Foxglove bridge (ws://<pi>:8765, display frame: map)" }
bag = { cmd = "ros2 run mdp_bringup trigger /bag/start", description = "Start recording a bag (every topic except camera images) into bags/ - same as the Foxglove REC button" }
bag-stop = { cmd = "ros2 run mdp_bringup trigger /bag/stop", description = "Stop recording and close the bag" }
bag-all = { cmd = "ros2 bag record -a -o bags/rosbag2_$(date +%Y%m%d_%H%M%S)", description = "Record everything, including camera images (large)" }

# --- Sim assets ---------------------------------------------------------------
panels = { cmd = "python src/mdp_description/scripts/gen_symbol_meshes.py", description = "Generate the symbol panel meshes" }
import-symbols = { cmd = "python src/mdp_description/scripts/import_symbol_textures.py", description = "Import the symbol textures" }

[dependencies]
# Core ROS2 & Control
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-topic-based-ros2-control = "*"

# Telemetry & Sensor Fusion
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-robot-localization = "*"

# Planning & Math
scipy = "*"
numpy = "*"
pyyaml = "*"

# Vision Runtime
ros-jazzy-cv-bridge = "*"
# opencv = "*"
# libblas = { version = "*", build = "*openblas" }
# liblapack = { version = "*", build = "*openblas" }

# Build Tools
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
hypothesis = ">=6.168.1,<7"

[pypi-dependencies]
ultralytics = "*"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cpu" }
ncnn = "*"

# ---------------------------------------------------------------------------
# Laptop-only targets (Simulation, GUI testing, Model conversion)
# ---------------------------------------------------------------------------
[target.linux-64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.linux-64.pypi-dependencies]
pnnx = "*"

[target.osx-arm64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.osx-arm64.pypi-dependencies]
pnnx = "*"

[activation]
scripts = ["install/setup.bash"]

# NVIDIA GPU for Gazebo rendering when the driver is present (no-op otherwise).
# A target's scripts REPLACE the list above, so install/setup.bash is repeated.
[target.linux-64.activation]
scripts = ["install/setup.bash", "scripts/activate_gpu.sh"]

[activation.env]
ROS_DOMAIN_ID = "14"
# Pi <-> laptop: no multicast discovery, reach the other machine directly.
# Same list on both machines (Pi first, laptop second; listing yourself is harmless).
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_STATIC_PEERS = "10.42.0.1;10.42.0.10"     # Ethernet cable
# ROS_STATIC_PEERS = "10.43.0.1;10.43.0.10"   # Pi's WiFi hotspot MDP-Grp14
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
