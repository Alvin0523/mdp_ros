[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
build = "colcon build --symlink-install"
test = "colcon test"
clean = "rm -rf build install log"
sim = "ros2 launch mdp_bringup sim.launch.py"
sim-task2 = "ros2 launch mdp_bringup task2_sim.launch.py"
hardware = "ros2 launch mdp_bringup real.launch.py"
agent-build = "bash scripts/build_microxrce_agent.sh"
agent = "../Micro-XRCE-DDS-Agent/build/MicroXRCEAgent serial --dev /dev/ttyUSB0 -b 115200"
task1 = "ros2 run mdp_control task1_runner.py"
task2 = "ros2 run mdp_control task2_runner.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true"
foxglove = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml use_sim_time:=true"

[dependencies]
# Core ROS2
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-teleop-twist-keyboard = "*"

# ros2_control stack (framework, controllers, simulation & real hardware plugins)
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-topic-based-ros2-control = "*"

# Visualization & bridge
ros-jazzy-ros-gz = "*"
ros-jazzy-foxglove-bridge = "*"

# Path planning (spline-based waypoint smoothing for task2)
scipy = "*"

# Build tools
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
git = "*"

[activation]
scripts = ["install/setup.bash"]

[activation.env]
ROS_DOMAIN_ID = "0"
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
IGN_GAZEBO_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
