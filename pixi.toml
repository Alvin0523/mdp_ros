[workspace]
authors = ["Wei Ming <alvinwm0523@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "mdp_ros"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Workspace lifecycle
build = "colcon build --symlink-install"
test = "colcon test"
clean = "rm -rf build install log"

# Real Hardware (RPi + STM32)
real1 = "ros2 launch mdp_bringup real.launch.py serial_port:=/dev/ttyACM0 task:=1"
real2 = "ros2 launch mdp_bringup real.launch.py serial_port:=/dev/ttyACM0 task:=2"
setup = "ros2 run mdp_bringup publish_test_obstacles.py"
go = "ros2 run mdp_bringup go.py"
dist = "ros2 run mdp_bringup drive_distance.py"
rotate = "ros2 run mdp_bringup rotate_angle.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true"
vision = "ros2 launch mdp_yolo vision.launch.py"

# Simulation (Laptop only)
sim = "ros2 launch mdp_bringup sim.launch.py"
sim1 = "ros2 launch mdp_bringup task1_sim.launch.py"
sim2 = "ros2 launch mdp_bringup task2_sim.launch.py"
panels = "python src/mdp_description/scripts/gen_symbol_meshes.py"
import-symbols = "python src/mdp_description/scripts/import_symbol_textures.py"

# Telemetry & Recording
foxglove = "ros2 launch foxglove_bridge foxglove_bridge_launch.xml"
bag = "ros2 bag record -a -o bags/rosbag2_$(date +%Y%m%d_%H%M%S)"

[dependencies]
# Core ROS2 & Control
ros-jazzy-ros-base = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-topic-based-ros2-control = "*"

# Telemetry & Sensor Fusion
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-robot-localization = "*"

# Planning & Math
scipy = "*"
numpy = "*"
pyyaml = "*"

# Vision Runtime
ros-jazzy-cv-bridge = "*"
opencv = "*"
libblas = { version = "*", build = "*openblas" }
liblapack = { version = "*", build = "*openblas" }

# Build Tools
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"

[pypi-dependencies]
ultralytics = "*"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cpu" }
ncnn = "*"

# ---------------------------------------------------------------------------
# Laptop-only targets (Simulation, GUI testing, Model conversion)
# ---------------------------------------------------------------------------
[target.linux-64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.linux-64.pypi-dependencies]
pnnx = "*"

[target.osx-arm64.dependencies]
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[target.osx-arm64.pypi-dependencies]
pnnx = "*"

# ---------------------------------------------------------------------------
# Raspberry Pi target (Hardware camera drivers & build chain)
# ---------------------------------------------------------------------------
[target.linux-aarch64.dependencies]
libevent = "*"
meson = "*"
pkg-config = "*"
colcon-meson = "*"
yaml = "*"
pyyaml = "*"
ply = "*"
jinja2 = "*"
gnutls = "*"
openssl = "*"
libtiff = "*"
libudev = "*"
ros-jazzy-camera-info-manager = "*"
ros-jazzy-image-transport = "*"

[activation]
scripts = ["install/setup.bash"]

[activation.env]
ROS_DOMAIN_ID = "0"
GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib"
